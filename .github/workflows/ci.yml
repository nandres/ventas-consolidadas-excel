name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python consolidar.py
      - run: python -c "import openpyxl; w = openpyxl.load_workbook('salida/ventas_consolidadas.xlsx'); print(w.sheetnames)"
